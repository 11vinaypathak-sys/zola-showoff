<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZOLA · the world</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./jsm/"}}</script>
<style>
:root{
  --g0:#0a0a0b;--g1:#101012;--g2:#17171a;--g3:#1e1e22;
  --t1:#ededf0;--t2:#a1a1aa;--t3:#71717a;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ac:#d6f84a;--up:#4ade80;--down:#f87171;--warn:#fbbf24;
  --fd:'Space Grotesk',Inter,system-ui,sans-serif;--fb:Inter,system-ui,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.4,0,.2,1);--fast:140ms;--mid:220ms;--slow:320ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--g0);color:var(--t1);font:14px/1.5 var(--fb);-webkit-font-smoothing:antialiased;overflow:hidden}
canvas#gl{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:grab}
canvas#gl.drag{cursor:grabbing}
canvas#gl{touch-action:none}
.field-controls{display:flex;align-items:center;gap:8px;margin-left:auto}.field-controls button,.field-controls select{color:var(--t2);background:#11111cdd;border:1px solid rgba(230,210,170,.18);border-radius:999px;padding:8px 12px;font:500 11px var(--fm)}.field-controls button{cursor:pointer}.field-controls .tour{margin:0}@media(max-width:700px){.field-controls{gap:4px}.field-controls button,.field-controls select{padding:8px;font-size:10px}.strip .s3{display:none}}
.ui{position:fixed;inset:0;z-index:3;pointer-events:none;display:grid;grid-template-rows:auto 1fr auto;padding:22px 26px calc(22px + env(safe-area-inset-bottom,0px))}
.ui>*{pointer-events:auto}
.top{display:flex;align-items:center;gap:16px}
.mark{font:700 15px/1 var(--fd);letter-spacing:.18em;text-transform:uppercase}.mark b{color:var(--ac)}
.crumb{font:500 11px/1 var(--fm);color:var(--t3);letter-spacing:.08em;text-transform:uppercase}.crumb span{color:var(--t2)}
.top .r{margin-left:auto;display:flex;align-items:center;gap:8px}
/* region index — the mind-map's table of contents, outlined shells, one filled */
.idx{display:flex;gap:6px}
.ix{border:1px solid var(--line2);border-radius:999px;padding:6px 11px;background:transparent;color:var(--t2);
  font:500 11px/1 var(--fm);letter-spacing:.06em;cursor:pointer;display:flex;align-items:center;gap:7px;transition:border-color var(--fast) var(--ease),color var(--fast) var(--ease)}
.ix i{width:7px;height:7px;border-radius:50%;background:var(--hue,#777)}
.ix:hover{border-color:rgba(255,255,255,.22);color:var(--t1)}
.ix[aria-current="true"]{border-color:var(--ac);color:var(--t1);background:rgba(214,248,74,.06)}
.mid{align-self:center;justify-self:start;max-width:430px;pointer-events:none;transition:opacity var(--slow) var(--ease)}
.mid.hide{opacity:0}
.h{font:500 clamp(28px,4.2vw,50px)/1.02 var(--fd);letter-spacing:-.02em}.h em{font-style:normal;color:var(--ac)}
.sub{margin-top:14px;color:var(--t2);max-width:380px}
.note{margin-top:22px;font:400 12px/1.5 var(--fm);color:var(--t3);max-width:360px;border-left:1px solid var(--line2);padding-left:12px}.note b{color:var(--t2);font-weight:500}
/* inside page — the camera dives, the page slides over the left two-thirds; the landmark stays alive on the right.
   Flat: one solid surface, one hairline, one 2px hue rule. The instrument is the only anchor. */
.page{position:fixed;left:0;top:0;bottom:0;z-index:2;width:min(64vw,900px);background:rgba(10,10,11,.9);border-right:1px solid var(--line);
  padding:78px 44px 60px 26px;display:grid;grid-template-rows:auto 1fr auto;gap:26px;opacity:0;pointer-events:none;transform:translateX(-18px);
  transition:opacity var(--slow) var(--ease),transform var(--slow) var(--ease);overflow:hidden}
.page.on{opacity:1;pointer-events:auto;transform:none}
.page::before{content:"";position:absolute;left:26px;top:64px;width:48px;height:2px;background:var(--hue,var(--ac))}
.k{font:500 10px/1 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--t3)}
.pg-head .k{display:flex;gap:14px}.pg-head .k b{color:var(--t2);font-weight:500}
.pg-head h1{margin-top:12px;font:500 clamp(26px,3.1vw,40px)/1.04 var(--fd);letter-spacing:-.02em;max-width:17ch}
.pg-head p{margin-top:12px;color:var(--t2);max-width:52ch;font-size:13.5px}
.pg-body{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:28px;align-content:start;overflow:auto;scrollbar-width:none;padding-right:2px}
.pg-body::-webkit-scrollbar{display:none}
.pg-body>.inst{min-width:0}
.pg-note{font:400 12px/1.55 var(--fm);color:var(--t3);border-left:1px solid var(--line2);padding-left:12px;align-self:start;margin-top:4px}
.pg-note b{color:var(--t2);font-weight:500;display:block;margin-bottom:4px}
.pg-nav{display:flex;align-items:center;gap:8px}
.pg-nav button{border:1px solid var(--line2);border-radius:999px;padding:7px 12px;background:transparent;color:var(--t2);font:500 11px/1 var(--fm);letter-spacing:.06em;cursor:pointer}
.pg-nav button:hover{color:var(--t1);border-color:rgba(255,255,255,.22)}
.pg-nav .sp{flex:1}.pg-nav i{width:7px;height:7px;border-radius:50%;background:var(--nh,#777);display:inline-block;margin-right:7px;vertical-align:1px}
/* hero numeral — dot-matrix as punctuation, one per page */
.hero{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.hero.money .hn{font-size:clamp(40px,4.4vw,64px)}.hero .hl{max-width:260px}
.inst.dense .hero .hn{font-size:clamp(40px,4.6vw,64px)}.inst.dense .chain .st{min-height:54px}.inst.dense .q{padding:6px 10px}
.hn{font:700 clamp(54px,7vw,96px)/.85 var(--fd);letter-spacing:.04em;font-variant-numeric:tabular-nums;
  background:radial-gradient(circle,var(--t1) 0 1.3px,transparent 1.6px) 0 0/6px 6px;-webkit-background-clip:text;background-clip:text;color:transparent}
.hl{font:500 12px/1.4 var(--fm);color:var(--t2);padding-bottom:6px;letter-spacing:.02em}
/* staged reveal: anything with data-at lights when the page clock passes it */
[data-at]{opacity:.22;transform:translateY(6px);transition:opacity var(--mid) var(--ease),transform var(--mid) var(--ease)}[data-at].on{opacity:1;transform:none}
/* page head arrives in three beats: rule, eyebrow, headline */
.page .pg-head>*{opacity:0;transform:translateY(8px);transition:opacity var(--slow) var(--ease),transform var(--slow) var(--ease)}
.page.on .pg-head>*{opacity:1;transform:none}.page.on .pg-head>:nth-child(2){transition-delay:80ms}.page.on .pg-head>:nth-child(3){transition-delay:160ms}
.page::before{transform:scaleX(0);transform-origin:left;transition:transform var(--slow) var(--ease)}.page.on::before{transform:none}
/* boot: the UI arrives after the world has assembled */
html.boot .ui,html.boot #labels{opacity:0}.ui,#labels{transition:opacity 600ms var(--ease)}
/* hovered landmark name brightens */
.lm.hot{color:var(--t1)}
/* system page: stack diagram + module inventory */
.stack{display:flex;flex-direction:column-reverse;gap:4px;margin:4px 0 14px}
.layer{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:baseline;border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.layer .ln{font:500 10px/1 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--t3)}
.layer .lt{font:500 13px/1.3 var(--fd);color:var(--t1)}.layer .ld{font:400 11px/1.4 var(--fm);color:var(--t3)}
.layer.on{border-color:var(--line2)}.layer.on .ln{color:var(--hue)}
.mods{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 14px}
.mod{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font:400 11.5px/1.35 var(--fb);color:var(--t2)}
.mod code{font:500 11px/1 var(--fm);color:var(--t1);white-space:nowrap}
.facts{display:flex;gap:18px;margin:12px 0 2px;flex-wrap:wrap}
.fact{font:500 11px/1.3 var(--fm);color:var(--t3);letter-spacing:.04em}.fact b{display:block;font:700 22px/1 var(--fd);color:var(--t1);letter-spacing:-.01em;margin-bottom:3px}
.keys{display:flex;gap:14px;flex-wrap:wrap}.keys em{font-style:normal;display:inline-flex;align-items:center;gap:6px;font:500 10px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}.keys span{color:var(--t1);border:1px solid var(--line2);border-radius:4px;padding:3px 6px}
/* ladder */
.ladder{display:grid;grid-template-columns:28px 1fr;gap:0 14px}
.rung{display:contents}.rung .no{font:500 10px/1 var(--fm);color:var(--t3);padding:10px 0;letter-spacing:.1em}
.rung .nm{padding:9px 0;border-bottom:1px solid var(--line);font:500 13px/1.3 var(--fb);color:var(--t3);display:flex;justify-content:space-between}
.rung.cur .nm,.rung.cur .no{color:var(--t1)}.rung.cur .nm{border-color:var(--hue)}.rung.done .nm{color:var(--t2)}
.rung .nm span{font:500 11px/1 var(--fm);color:var(--t3)}
/* timeline (intel) */
.tl{position:relative;height:120px;border-bottom:1px solid var(--line2);margin:8px 0 6px}
.tl .pg.b{height:70px}.tl .pg.c{height:100px}
.tl .d{position:absolute;bottom:-1px;width:1px;height:8px;background:var(--line2)}
.tl .pg{position:absolute;bottom:0;width:2px;height:40px;background:var(--hue)}.tl .pg::after{content:attr(data-l);position:absolute;left:8px;top:-4px;font:500 10px/1.3 var(--fm);color:var(--t1);white-space:nowrap}
.tl .sil{position:absolute;bottom:14px;height:1px;background:var(--line2)}.tl .sil::after{content:attr(data-l);position:absolute;left:50%;transform:translateX(-50%);top:-14px;font:500 9px/1 var(--fm);color:var(--t3);letter-spacing:.1em;white-space:nowrap}
.tl .ax{position:absolute;top:100%;margin-top:6px;font:500 9px/1 var(--fm);color:var(--t3);letter-spacing:.08em}
/* cron strip (engine) */
.ticks{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:14px}
.ticks i{height:18px;border:1px solid var(--line);border-radius:3px;position:relative}
.ticks i.on{border-color:var(--hue)}.ticks i.on::after{content:"";position:absolute;inset:4px;background:var(--hue);border-radius:1px}
.ticks i.now{border-color:var(--ac)}.ticks i.now::after{content:"";position:absolute;inset:4px;background:var(--ac);border-radius:1px}
.scrim{position:fixed;inset:0;z-index:1;background:rgba(10,10,11,.38);opacity:0;pointer-events:none;transition:opacity var(--slow) var(--ease)}.scrim.on{opacity:1}
/* engine exhibit (question → verdict) */
.qs{display:flex;flex-direction:column;gap:6px}
.q{text-align:left;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:transparent;color:var(--t2);font:500 12.5px/1.3 var(--fb);cursor:pointer;transition:border-color var(--fast) var(--ease),color var(--fast) var(--ease)}
.q:hover{border-color:rgba(255,255,255,.22);color:var(--t1)}
.q[aria-pressed="true"]{border-color:var(--ac);color:var(--t1);background:rgba(214,248,74,.06)}
.chain{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.chain3{grid-template-columns:repeat(3,1fr)}
.st{border:1px solid var(--line);border-radius:8px;padding:8px 8px 7px;position:relative;min-height:64px}
.st .n{font:500 9px/1 var(--fm);color:var(--t3);letter-spacing:.1em}
.st .tt{font:700 10px/1 var(--fd);letter-spacing:.08em;text-transform:uppercase;margin-top:6px;color:var(--t3)}
.st .dd{font:400 11px/1.4 var(--fb);color:var(--t3);margin-top:6px}
.st.on{border-color:var(--line2)}.st.on .tt{color:var(--t1)}.st.on .dd{color:var(--t2)}
.st.on::before{content:"";position:absolute;left:8px;right:8px;top:-1px;height:2px;background:var(--ac)}
.ok{color:var(--up)}.no{color:var(--down)}
.v{margin-top:12px;font:500 16px/1.25 var(--fd)}
.why{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.why div{font:400 11.5px/1.4 var(--fm);color:var(--t2);padding-left:12px;position:relative}
.why div::before{content:"";position:absolute;left:0;top:7px;width:6px;height:1px;background:var(--t3)}
.sw{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:999px;padding:6px 10px 6px 12px;font:500 11px/1 var(--fm);color:var(--t2);letter-spacing:.06em;cursor:pointer;background:transparent;margin-top:12px}
.sw i{width:28px;height:16px;border-radius:999px;border:1px solid var(--line2);position:relative;display:inline-block;transition:background var(--mid) var(--ease)}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--t2);transition:transform var(--mid) var(--ease),background var(--mid) var(--ease)}
.sw[aria-checked="true"] i{background:rgba(214,248,74,.14);border-color:rgba(214,248,74,.5)}
.sw[aria-checked="true"] i::after{transform:translateX(12px);background:var(--ac)}
.aitext{margin-top:10px;font:400 11.5px/1.45 var(--fb);color:var(--t3)}.aitext b{color:var(--t2);font-weight:500}
/* verdict cards: the output contract drawn once, used on every page */
.vfeed{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.vc{display:grid;grid-template-columns:64px 1fr auto;gap:0 12px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:9px 12px 8px;position:relative}
.vc.on{border-color:var(--line2)}
.vc .vv{font:700 10px/1 var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding-top:3px}
.vc.on .vv.act{color:var(--ac)}.vc.on .vv.data{color:var(--t2)}.vc.on .vv.wait{color:var(--t3)}.vc.on .vv.settled{color:var(--up)}
.vc .vm{font:500 13px/1.3 var(--fd);color:var(--t1)}.vc .vr{font:400 11px/1.45 var(--fb);color:var(--t3);margin-top:3px}
.vc .vr b{font-weight:500;color:var(--t2)}
.vc .vn{text-align:right;font:500 13px/1 var(--fm);color:var(--t1);white-space:nowrap}.vc .vn small{display:block;font:500 9px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-top:5px}
.vc .vx{grid-column:2/4;font:400 10.5px/1.4 var(--fm);color:var(--t3);margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.vc .vx i{font-style:normal;color:var(--t2)}
.vfoot{font:500 10px/1.4 var(--fm);letter-spacing:.06em;color:var(--t3);margin-top:8px}
/* generic exhibit widgets */
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;align-items:baseline;font:400 12.5px/1.3 var(--fb);color:var(--t2);padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.row b{color:var(--t1);font-weight:500}.row .num{font-family:var(--fm);font-size:12px}
.grid7{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:4px}
.grid7 i{aspect-ratio:1;border-radius:2px;background:var(--g3)}.grid7 i.made{background:var(--hue,var(--ac));opacity:.82}.grid7 i.half{background:rgba(255,255,255,.2)}
.bar{height:6px;background:var(--g3);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--hue,var(--ac))}
.chk{display:flex;align-items:center;gap:8px;font:400 12.5px/1.3 var(--fb);color:var(--t2);padding:6px 0}
.chk i{width:12px;height:12px;border:1px solid var(--line2);border-radius:3px;display:inline-block;position:relative}
.chk.done{color:var(--t1)}.chk.done i{border-color:var(--hue,var(--ac));background:var(--hue,var(--ac))}
.ping{display:flex;align-items:center;gap:10px;font:400 12px/1.3 var(--fm);color:var(--t2);padding:6px 0;border-bottom:1px solid var(--line)}
.ping:last-child{border-bottom:0}.ping b{color:var(--t1);font-weight:500}.ping span{margin-left:auto;color:var(--t3)}
.lbl{position:fixed;transform:translate(-50%,-130%);pointer-events:none;font:500 11px/1 var(--fm);color:var(--t1);white-space:nowrap;opacity:0;transition:opacity var(--mid) var(--ease);padding:5px 8px;border:1px solid var(--line2);border-radius:6px;background:rgba(10,10,11,.8)}
.lbl.dead{color:var(--t3);text-decoration:line-through}.lbl.on{opacity:1}
.lm{position:fixed;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;font:700 11px/1 var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--t2);opacity:0;transition:opacity var(--mid) var(--ease),color var(--fast) var(--ease);text-shadow:0 0 12px #0a0a0b,0 0 4px #0a0a0b}
.lm.on{opacity:1}.lm:hover{color:var(--t1)}.lm small{display:block;font:500 9px/1.2 var(--fm);letter-spacing:.08em;color:var(--t3);margin-top:4px;text-transform:none}
.bot{display:flex;align-items:flex-end;gap:14px;grid-row:3;pointer-events:none}.bot .field-controls{pointer-events:auto}
/* bottom strip: the only words on the overview. Dot-matrix wordmark as punctuation, one line of what, one line of how. */
.strip{display:flex;gap:28px;align-items:flex-end;flex:1;min-width:0;transition:opacity var(--slow) var(--ease)}
.strip.hide{opacity:0;pointer-events:none}
.s1{font:700 clamp(30px,4.2vw,56px)/.9 var(--fd);letter-spacing:.22em;flex:none;
  background:radial-gradient(circle,var(--t1) 0 1.1px,transparent 1.4px) 0 0/5px 5px;-webkit-background-clip:text;background-clip:text;color:transparent}
.s2{font:500 12px/1.5 var(--fm);color:var(--t2);letter-spacing:.02em;padding-bottom:4px;flex:1;min-width:180px}
.s3{font:500 10px/1 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--t3);padding-bottom:6px;display:flex;gap:18px;flex:none}
.s3 em{font-style:normal;display:inline-flex;align-items:center;gap:7px}
.s3 span{color:var(--t1);border:1px solid var(--line2);border-radius:4px;padding:3px 6px}
@media (max-width:1100px){.s3{display:none}}
@media (max-width:760px){.s2{display:none}}
.hint{display:none}
.tour{margin-left:auto;border:1px solid var(--line2);border-radius:999px;padding:7px 12px;background:transparent;color:var(--t2);font:500 11px/1 var(--fm);letter-spacing:.06em;cursor:pointer}
.tour:hover{color:var(--t1);border-color:rgba(255,255,255,.22)}
.tour.hide{opacity:0;pointer-events:none}
#labels{position:fixed;inset:0;z-index:2;pointer-events:none}#labels .lm{pointer-events:auto}
/* harness: a still frame must not depend on when the screenshot lands mid-transition */
html.still *{transition:none !important;animation:none !important}
@media (max-width:820px){.mid{display:none}.idx .ix span{display:none}.page{width:100vw;padding:70px 16px 24px;border-right:0}.pg-body{grid-template-columns:1fr}.pg-note{display:none}}

/* exhibits: one drawing per page, drawn from the feed; the text sits under it */
.ex{margin:6px 0 18px;padding-top:14px;border-top:2px solid var(--hue)}
.ex svg{width:100%;height:auto;display:block;overflow:visible}
.ex .xl{font:500 12px var(--fm);fill:var(--t2);letter-spacing:.08em;text-transform:uppercase}
.ex .xl.dim{fill:var(--t3);text-transform:none;letter-spacing:.02em;font-size:11.5px}
.ex .num{font:500 46px/1 var(--fd);fill:var(--t1);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ex .num.sm{font-size:34px}
.ex div.num{font:500 clamp(36px,4vw,56px)/1 var(--fd);color:var(--t1);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ex div.xl{font:500 10px/1.5 var(--fm);color:var(--t2);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.ex div.xl.dim{color:var(--t3);text-transform:none;letter-spacing:.02em}
.ex .arcbg{stroke:var(--line2);fill:var(--line2)}
.ex path.arcbg{fill:none}
.ex .arc{stroke:var(--hue);fill:none;stroke-dasharray:var(--len) var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.4s var(--ease)}
.ex .arc.on{stroke-dashoffset:var(--off)}
.ex .over{stroke:#fbbf24;fill:none}
.ex .mk{stroke:var(--line2);stroke-width:1}
.ex .cap{stroke:var(--t1);stroke-width:1.5}
.ex .needle line{stroke:var(--t1);stroke-width:1.5}
.ex .needle circle{fill:var(--t1)}
.ex .rail{stroke:var(--line2);stroke-width:1}
.ex .rung line{stroke:var(--line2);stroke-width:1.5;stroke-dasharray:3 4}
.ex .rung.done line{stroke:var(--t3);stroke-dasharray:none}
.ex .rung.cur line{stroke:var(--hue);stroke-width:3;stroke-dasharray:none}

/* ---------------- demo data (seeded, fictional) ---------------- */
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

  {id:'finance', name:'Finance',  hex:0xe3c98f, ang:-0.35, r:26, y: 3,  tag:'cockpit',   one:'Money has a dashboard. Decisions have due dates.',

   inside:'The whole backend on one page: the five-layer stack, the thirteen engine modules and what each one is for, the scheduler ticking, and a verdict chain you can run yourself — then switch the AI off and watch nothing change.'},
];
REG.forEach(g=>{ g.c=new THREE.Vector3(Math.cos(g.ang)*g.r, g.y, Math.sin(g.ang)*g.r); g.color=new THREE.Color(g.hex); g.css='#'+g.hex.toString(16).padStart(6,'0'); });
const TITLES={
  finance:['Rebalance rule v3 — kept','Credit sleeve cap 48% — kept','Denominator trap note','Drawdown rule stays silent until history','Rotation ≠ exit (FPI read)','Quarterly cadence, not hourly','Sparkline empty beats a fake flat line','Informs, never trades'],

};
const nodes=[]; const PER=24;   // a sparse cloud: the notes live inside the page, not around the planet
REG.forEach((g,ci)=>{ for(let i=0;i<PER;i++){
  const rr=3.2+R()*7.5, th=R()*Math.PI*2, ph=Math.acos(2*R()-1);
  const off=new THREE.Vector3(rr*Math.sin(ph)*Math.cos(th), rr*Math.sin(ph)*Math.sin(th)*.6, rr*Math.cos(ph));
  nodes.push({off, p:off.clone().add(g.c), ci, w:Math.pow(R(),2.2), title:i<8?TITLES[g.id][i]:null, dead:false, spin:(R()-.5)*0.08});
}});
['Festive-timing edge — tested dead','Named-politician tracking — declined','Hourly market watch — scope inflation','Spinner for loading — replaced by scan','Equal-sized tiles — hierarchy lost']
 .forEach((t,i)=>{ const p=new THREE.Vector3(-8+i*3.2, -22+R()*2, 38+R()*3); nodes.push({off:p.clone(),p,ci:4,w:.08,title:t,dead:true,spin:0}); });
const N=nodes.length;
const edges=[];
for(let i=0;i<N;i++){ if(nodes[i].dead) continue; let cand=[];
  for(let j=0;j<N;j++){ if(i===j||nodes[j].dead||nodes[j].ci!==nodes[i].ci) continue; const d=nodes[i].p.distanceTo(nodes[j].p); if(d<4.6) cand.push([d,j]); }
  cand.sort((a,b)=>a[0]-b[0]); cand.slice(0,3).forEach(([,j])=>{ if(i<j) edges.push([i,j]); }); }
// the brain: every region's strongest memories connect to the core
const CORE=new THREE.Vector3(0,0,0);
const coreLinks=[]; REG.forEach((g,ci)=>{ const idx=nodes.map((n,i)=>[n,i]).filter(([n])=>n.ci===ci&&!n.dead).sort((a,b)=>b[0].w-a[0].w).slice(0,3).map(([,i])=>i); coreLinks.push(...idx); });

const QUESTIONS=[
  {q:'Should I rebalance before the quarter ends?', region:'finance', cls:'Finance · allocation', aff:{finance:1,engine:.3},
   rules:[['Quarterly cadence rule','ok'],['Credit sleeve ≤ 48%','ok'],['Drawdown trigger','silent — history too short']],
   v:'Hold. Rebalance on the scheduled date, not on the mood.', why:['Cadence rule governs; today is not the date','Allocation inside caps — no breach to act on','Drawdown rule has no history yet, so it stays silent'],
   ai:'The shell would add: the names you are worried about moved with their control group — macro, not thesis. Proposal only.'},
  {q:'Is the overnight news a signal or noise?', region:'intel', cls:'Intel · event read', aff:{intel:1,finance:.4},
   rules:[['Control-group spread','ok'],['Post-news price discovery','ok'],['Named-source check','ok']],
   v:'Noise until the spread opens. Watch, do not act.', why:['Named median tracked the control median — no isolated event','The only post-news session traded the other way','Survivorship: the loud stories are the ones that paid'],
   ai:'The shell would add: set a one-line alert on the spread so you stop watching the screen. Proposal only.'},
  {q:'Did the last outreach move actually work?', region:'career', cls:'Career · learned move', aff:{career:1,creative:.3},
   rules:[['Outcome recorded','ok'],['Sample ≥ 8 for "proven"','no — n = 3'],['Decay since last win','ok']],
   v:'Lean, not use. Three wins is a survivor, not a proof.', why:['Honest floor at n = 3 is ~44%, not 100%','Move stays a candidate until the sample grows','Keep recording outcomes — advice is only as honest as the feedback'],
   ai:'The shell would add: the warm-intro variant has the strongest precondition match this week. Proposal only.'},

function weightsFor(qi){ const Q=QUESTIONS[qi], r2=rng(900+qi), w=new Float32Array(N);
  for(let i=0;i<N;i++){ const n=nodes[i]; if(n.dead){w[i]=0;continue;} const a=Q.aff[REG[n.ci].id]||0; w[i]=a*(0.35+0.65*n.w)*(0.6+0.4*r2())*(n.title?(a>=0.9?3.5:1.3):1); }
  const idx=[...w.keys()].sort((a,b)=>w[b]-w[a]).slice(0,8), top=new Set(idx), mx=w[idx[0]]||1;

  return {w,path}; }

/* ---------------- scene ---------------- */
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x080912); scene.fog=new THREE.FogExp2(0x080912,0.0075);

const physicalKey=new THREE.DirectionalLight(0xffe5bc,2.3); physicalKey.position.set(35,45,40); scene.add(physicalKey);

new RGBELoader().load('./assets/materials/studio_small_09_1k.hdr',texture=>{
  const pmrem=new THREE.PMREMGenerator(renderer); const env=pmrem.fromEquirectangular(texture);
  scene.environment=env.texture; texture.dispose(); pmrem.dispose(); assetLighting.ready=true;

},undefined,error=>{ assetLighting.error=String(error); console.warn('Local reflection lighting unavailable; direct lights remain active.',error); });
function retainPhysicalMaterial(mesh){
  for(const material of [].concat(mesh.material)){
    material.toneMapped=false; material.envMapIntensity=0.30; material.fog=false;
    // Compress only physical-surface highlights; the existing galaxy grading is untouched.
    material.onBeforeCompile=shader=>{
      shader.fragmentShader=shader.fragmentShader.replace('#include <opaque_fragment>',
        'outgoingLight *= 0.80; outgoingLight = outgoingLight / (vec3(1.0) + outgoingLight);\n#include <opaque_fragment>');
    };
    material.customProgramCacheKey=()=> 'zola-physical-highlight-rolloff-v1';
    if(material.transparent) material.depthWrite=false;
  }
  mesh.frustumCulled=false;
}

const LIME=new THREE.Color(0xd6f84a), DIM=new THREE.Color(0x26262b);

// memories: instanced emitters
// memories: instanced spheres with a fresnel so near ones read as lit volumes, not flat discs. The renderer adds the
// USE_INSTANCING / USE_INSTANCING_COLOR defines from the mesh, so the chunks below pick up instanceMatrix and instanceColor.
const geo=new THREE.SphereGeometry(1,14,10), mat=new THREE.ShaderMaterial({toneMapped:false,
  vertexShader:`#include <common>
    varying vec3 vN,vV,vC;
    void main(){ vec3 transformed=position; vec3 objectNormal=normal;
      #ifdef USE_INSTANCING
        transformed=(instanceMatrix*vec4(transformed,1.0)).xyz; objectNormal=mat3(instanceMatrix)*objectNormal;
      #endif
      vC=vec3(1.0);
      #ifdef USE_INSTANCING_COLOR
        vC=instanceColor;
      #endif

function goto(ci,instant=false){ document.body.classList.toggle('has-region',ci>=0); if(ci!==cur&&!instant) divePulse=1; cur=ci;
  if(ci<0){ Ft.set(0,0,0); distt=Math.max(60,32/(Math.tan(28*Math.PI/180)*(innerWidth/innerHeight))); pht=1.14; } else { Ft.copy(REG[ci].c); distt={intel:17,finance:15,career:14}[REG[ci].id]||13; pht={intel:0.95,finance:1.15}[REG[ci].id]||1.36; tht=REG[ci].ang+Math.PI*0.5; }

// drag to orbit, wheel to dolly
let dragging=false, lx=0, ly=0, downX=0, downY=0, dragTravel=0, interacted=false;
canvas.addEventListener('pointerdown',e=>{ dragging=true; lx=downX=e.clientX; ly=downY=e.clientY; dragTravel=0; canvas.setPointerCapture(e.pointerId); canvas.classList.add('drag'); stopTour(); });
addEventListener('pointerup',()=>{ dragging=false; canvas.classList.remove('drag'); });
addEventListener('pointermove',e=>{ if(!dragging) return; dragTravel=Math.max(dragTravel,Math.hypot(e.clientX-downX,e.clientY-downY)); tht+=(e.clientX-lx)*0.005; pht=Math.min(2.6,Math.max(0.35,pht+(e.clientY-ly)*0.004)); lx=e.clientX; ly=e.clientY; });
addEventListener('wheel',e=>{ if(document.getElementById('page').classList.contains('on')||e.target.closest('#page')) return; distt=Math.min(140,Math.max(9,distt*(1+e.deltaY*0.0012))); stopTour(); },{passive:true});
const touches=new Map(); let pinch=0;
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')touches.set(e.pointerId,{x:e.clientX,y:e.clientY});});
canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){const [a,b]=[...touches.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)distt=Math.max(9,Math.min(140,distt*pinch/d));pinch=d;dragging=false;dragTravel=100;}});
function endPointer(e){touches.delete(e.pointerId);pinch=0;dragging=false;canvas.classList.remove('drag');}
addEventListener('pointerup',endPointer);addEventListener('pointercancel',endPointer);
// click a landmark → fly there (raycast against landmarks)
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let downAt=0;
canvas.addEventListener('pointerdown',e=>{ downAt=performance.now(); });
// hover: the landmark under the pointer lifts a little and its name brightens; the cursor says it is a door
let hot=-1, hoverAt=0;
canvas.addEventListener('pointermove',e=>{ if(dragging||performance.now()-hoverAt<80) return; hoverAt=performance.now();
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight*2-1)); ray.setFromCamera(ndc,camera); ray.params.Line.threshold=0.5; ray.params.Points.threshold=0.4;
  const hits=ray.intersectObjects(landmarks,true); let ci=-1; if(hits.length){ let o=hits[0].object; while(o&&o.userData.ci===undefined) o=o.parent; if(o) ci=o.userData.ci; }
  if(ci!==hot){ hot=ci; canvas.style.cursor=hot>=0?'pointer':''; lmEls.forEach((el,i)=>el.classList.toggle('hot',i===hot)); } });
canvas.addEventListener('click',e=>{ if(performance.now()-downAt>350||dragTravel>5) return; // a drag, not a click
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight*2-1)); ray.setFromCamera(ndc,camera); ray.params.Line.threshold=0.5;
  const hits=ray.intersectObjects(landmarks,true); if(hits.length){ let o=hits[0].object; while(o&&o.userData.ci===undefined) o=o.parent; if(o) goto(o.userData.ci); return; }
  const c=ray.intersectObject(core,true); if(c.length) goto(-1); });
// keyboard flight: W/S or +/- dolly, A/D orbit, Q/E tilt (held keys repeat, so each press is a small mechanical step)
addEventListener('keydown',e=>{ if(e.target&&/INPUT|TEXTAREA|BUTTON|SELECT/.test(e.target.tagName)) return; const k=e.key.toLowerCase();
  if(k==='w'||k==='+'||k==='='){ distt=Math.max(6,distt*0.92); stopTour(); return; } if(k==='s'||k==='-'||k==='_'){ distt=Math.min(140,distt*1.09); stopTour(); return; }
  if(k==='a'){ tht-=0.08; stopTour(); return; } if(k==='d'){ tht+=0.08; stopTour(); return; }
  if(k==='q'){ pht=Math.max(0.35,pht-0.06); stopTour(); return; } if(k==='e'){ pht=Math.min(2.6,pht+0.06); stopTour(); return; }
  if(e.key>='1'&&e.key<='5') goto(+e.key-1); else if(e.key==='0') goto(-1); else if(e.key==='Escape') goto(-1);
  else if(e.key==='ArrowRight') goto(cur<0?0:(cur+1)%5); else if(e.key==='ArrowLeft') goto(cur<0?4:(cur+4)%5); });
// double-click (or double-tap) on the void → home. On a landmark it still just enters that region.
canvas.addEventListener('dblclick',e=>{ ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight*2-1)); ray.setFromCamera(ndc,camera);
  if(ray.intersectObjects(landmarks,true).length) return; stopTour(); goto(-1); });

// Only emitters (>1.0 luminance) bloom. Smoothing keeps the knee soft so a core does not pop in and out of bloom as it breathes.
// Depth of field is keyed to the focus point every frame, so whatever you are looking at is sharp and the far ring softens.
const composer=new EffectComposer(renderer,{frameBufferType:THREE.HalfFloatType}); composer.addPass(new RenderPass(scene,camera));
const BLOOM0=0.65, bloom=new BloomEffect({luminanceThreshold:1.0,luminanceSmoothing:0.25,intensity:BLOOM0,mipmapBlur:true,radius:0.65});
const dof=new DepthOfFieldEffect(camera,{focusDistance:0.0,focalLength:0.08,bokehScale:1.0});   // gentle: the far stars soften, they do not become discs
const vignette=new VignetteEffect({darkness:0.46,offset:0.28});
// lens: a hair of chromatic aberration at the frame edges and film grain under 5% — the two cues that say "camera", not "canvas"
const chroma=new ChromaticAberrationEffect({offset:new THREE.Vector2(0.0009,0.0005),radialModulation:true,modulationOffset:0.35});
const grain=new NoiseEffect({premultiply:true}); grain.blendMode.opacity.value=0.045;
const godrays=new GodRaysEffect(camera,core.userData.sun,{density:0.92,decay:0.94,weight:0.30,exposure:0.26,samples:48,clampMax:1.0,blur:true}); godrays.blendMode.opacity.value=STILL?1:0;
const raysPass=new EffectPass(camera,godrays); raysPass.enabled=false; composer.addPass(raysPass);
const depthPass=new EffectPass(camera,dof); depthPass.enabled=false; composer.addPass(depthPass);
composer.addPass(new EffectPass(camera,bloom,vignette,grain,new SMAAEffect()));
let sized=false; function resize(){ const w=innerWidth,h=innerHeight; if(!w||!h){sized=false;return;} sized=true; renderer.setSize(w,h); composer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); if(ribbon) ribbon.material.resolution.set(w,h); }

// ── the Verdict contract, drawn once ─────────────────────────────────────────
// A node's output is a NUMBER with a MOVE attached: metric · value · the rule it is judged
// against · a move with an amount and a date · what would change it. Four states: ACT, DATA
// (an input is missing, so the system asks), WAIT, SETTLED. Every page below renders its
// outputs through this one card, so a visitor learns the shape once and reads it five times.
const inr=n=>(n<0?'−':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const fmtVal=(v,u)=>v==null?'—':(u==='share'?(v*100).toFixed(1)+'%':u==='count'?(+v).toFixed(2):u==='points'?v+' pts':u==='INR'?inr(v):String(v));
function verdictCard(v,k){ const m=v.move||{}; const st=(v.verdict||'wait').toLowerCase();
  const num=m.amount?`<div class="vn">${inr(m.amount)}<small>${m.by?'by '+m.by:'move'}</small></div>`:`<div class="vn">${fmtVal(v.value,v.unit)}<small>${v.threshold!=null?'limit '+fmtVal(v.threshold,v.unit):'measured'}</small></div>`;
  const rule=v.threshold!=null&&m.amount?`<b>${fmtVal(v.value,v.unit)}</b> against a limit of <b>${fmtVal(v.threshold,v.unit)}</b> · ${v.rule}`:v.rule;
  const d=v.detail||{}; const extra=d.eff_n_after?`effective classes <i>${d.eff_n_now} → ${d.eff_n_after}</i> · class cap <i>${Math.round(d.class_cap*100)}%</i> · shock downside <i>${inr(d.downside)}</i> · ranked #${d.rank} by effect on structure, not by return`:(v.changes_if?`changes if · <i>${v.changes_if}</i>`:'');
  return at(k,`<div class="vc"><div class="vv ${st}">${v.verdict}</div><div><div class="vm">${m.what||v.metric}</div><div class="vr">${rule}</div></div>${num}${extra?`<div class="vx">${extra}</div>`:''}</div>`); }
function verdictFeed(list,k0=.2,step=.09){ return `<div class="vfeed">${list.map((v,i)=>verdictCard(v,k0+i*step)).join('')}</div>`; }
